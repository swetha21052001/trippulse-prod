steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: Build
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/trippulse:${_TAG}'
      - '.'

  # Step 2: Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: Push
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/trippulse:${_TAG}'

  # Step 3: Deploy the image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    id: Deploy
    args:
      - 'run'
      - 'deploy'
      - 'trippulse-service' # Name of your Cloud Run service
      - '--image'
      - 'gcr.io/$PROJECT_ID/trippulse:${_TAG}'
      - '--region'
      - 'us-central1' # Or your preferred region
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated' # Adjust based on your authentication needs
      - '--port'
      - '8080'
      - '--service-account'
      - 'trippulse-agent-sa@$PROJECT_ID.iam.gserviceaccount.com' # Your service account
      - '--set-env-vars'
      - 'GCP_PROJECT=$PROJECT_ID,GCP_LOCATION=$_REGION,ENABLE_FIRESTORE=true,ENABLE_BIGQUERY=true'
      - '--set-secrets'
      - 'HOTEL_API_KEY=HOTEL_API_KEY:latest,FLIGHT_API_KEY=FLIGHT_API_KEY:latest'
      - '--cpu'
      - '1' # Adjust CPU as needed
      - '--memory'
      - '512Mi' # Adjust memory as needed
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5' # Adjust max instances as needed
  # Step 4: Make the service publicly accessible
  - name: 'gcr.io/cloud-builders/gcloud'
    id: AllowPublic
    args:
      - 'run'
      - 'services'
      - 'add-iam-policy-binding'
      - 'trippulse-service'
      - '--region=us-central1'
      - '--member=allUsers'
      - '--role=roles/run.invoker'
images:
  - 'gcr.io/$PROJECT_ID/trippulse:${_TAG}'

substitutions:
  _TAG: 'latest'
  _REGION: 'us-central1'